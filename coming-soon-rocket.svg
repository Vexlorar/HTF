    <filter id="rk-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".8"/></filter>
    <linearGradient id="rk-hull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfc5d1"/><stop offset=".26" stop-color="#ffffff"/><stop offset=".58" stop-color="#e9ecf2"/><stop offset=".85" stop-color="#b3bac8"/><stop offset="1" stop-color="#8f97a8"/></linearGradient>
