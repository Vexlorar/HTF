    <filter id="rk-clay" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feGaussianBlur in="inv" stdDeviation="5" result="invb"/><feOffset in="invb" dx="-4" dy="-6" result="shOff"/><feFlood flood-color="#d8465a" flood-opacity=".5"/><feComposite in2="shOff" operator="in" result="shC"/><feComposite in="shC" in2="SourceAlpha" operator="in" result="innerSh"/><feOffset in="invb" dx="3" dy="4" result="hlOff"/><feFlood flood-color="#ffffff" flood-opacity=".95"/><feComposite in2="hlOff" operator="in" result="hlC"/><feComposite in="hlC" in2="SourceAlpha" operator="in" result="innerHl"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="innerSh"/><feMergeNode in="innerHl"/></feMerge></filter>
