<svg class="rk-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 168" width="96" height="96" role="img" aria-label="Coming Soon">
  <style> 
    .rk-sway { transform-origin: 84px 100px; animation: rk-sway .13s linear infinite; } 
    @keyframes rk-sway { 0% { transform: translate(0, 0); } 25% { transform: translate(.7px, -.7px); } 50% { transform: translate(-.6px, .6px); } 75% { transform: translate(.6px, .5px); } 100% { transform: translate(0, 0); } } 
    .rk-flame { transform-origin: 84px 111px; animation: rk-flame .09s ease-in-out infinite alternate; } 
    @keyframes rk-flame { from { transform: scale(.92, 1.05) skewX(-3deg); } to { transform: scale(1.08, 1.5) skewX(3deg); } } 
    .rk-mid { transform-origin: 84px 111px; animation: rk-mid .07s ease-in-out infinite alternate; } 
    @keyframes rk-mid { from { transform: scale(.9, .95); } to { transform: scale(1.04, 1.4); } } 
    .rk-glow { transform-origin: 84px 126px; animation: rk-glow .16s ease-in-out infinite alternate; } 
    @keyframes rk-glow { from { opacity: .6; transform: scale(.95, 1.1); } to { opacity: 1; transform: scale(1.15, 1.45); } } 
    .rk-bounce { animation: rk-bounce .16s ease-in-out infinite alternate; } 
    @keyframes rk-bounce { from { opacity: .6; } to { opacity: 1; } } 
    .rk-ember { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rk-ember .5s ease-out infinite; } 
    .rk-e2 { animation-delay: .16s; } 
    .rk-e3 { animation-delay: .32s; } 
    @keyframes rk-ember { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--rk-dx, 0), 40px) scale(.3); } } 
    .rk-zip { opacity: 0; animation: rk-zip .5s linear infinite; } 
    @keyframes rk-zip { 0% { transform: translateY(-60px); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(190px); opacity: 0; } } 
    .rk-cl { animation: rk-cloud 16s linear infinite; } 
    @keyframes rk-cloud { 0% { transform: translateY(-50px); opacity: 0; } 2.5% { opacity: 1; } 17.5% { opacity: 1; } 20% { transform: translateY(210px); opacity: 0; } 100% { transform: translateY(210px); opacity: 0; } } 
    .rk-sm { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rk-sm 1.2s ease-out infinite; } 
    @keyframes rk-sm { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 12% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--rk-sx, 0px), 95px) scale(2.8); } } 
    .rk-vx { stroke-dasharray: 10 14; animation: rk-vx .3s linear infinite; } 
    @keyframes rk-vx { to { stroke-dashoffset: -24; } } 
    .rk-glint { transform-box: fill-box; transform-origin: center; animation: rk-glint 1.8s ease-in-out infinite; } 
    .rk-g2 { animation-delay: .9s; } 
    @keyframes rk-glint { 0%, 60%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 80% { opacity: 1; transform: scale(1) rotate(45deg); } } 
    @media (prefers-reduced-motion: reduce) { 
      .rk-root * { animation: none !important; } 
      .rk-sm, .rk-ember, .rk-zip, .rk-glint { opacity: 0 !important; } 
    } 
  </style>
  <defs>
    <linearGradient id="rk-cloudg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffeef0"/><stop offset="1" stop-color="#f8c4cd"/></linearGradient>
    <path id="rk-cloud" d="M-24 8 C-32 8 -32 -6 -22 -6 C-22 -16 -8 -20 -2 -12 C4 -22 22 -20 22 -8 C32 -8 32 8 22 8 Z" fill="url(#rk-cloudg)"/>
    <radialGradient id="rk-sky" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rk-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="rk-trailg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="rk-puffg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".45" stop-color="#eeeaf2" stop-opacity=".88"/><stop offset=".8" stop-color="#c8c1d2" stop-opacity=".55"/><stop offset="1" stop-color="#a69fb6" stop-opacity="0"/></radialGradient>
    <filter id="rk-puffF" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.2"/></filter>
    <filter id="rk-bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feGaussianBlur in="inv" stdDeviation="5" result="invb"/><feOffset in="invb" dx="-4" dy="-6" result="shOff"/><feFlood flood-color="#d8465a" flood-opacity=".5"/><feComposite in2="shOff" operator="in" result="shC"/><feComposite in="shC" in2="SourceAlpha" operator="in" result="innerSh"/><feOffset in="invb" dx="3" dy="4" result="hlOff"/><feFlood flood-color="#ffffff" flood-opacity=".95"/><feComposite in2="hlOff" operator="in" result="hlC"/><feComposite in="hlC" in2="SourceAlpha" operator="in" result="innerHl"/><feMerge><feMergeNode in="innerSh"/><feMergeNode in="innerHl"/></feMerge></filter>
